name: Native x64 functional qualification

# Dedicated qualification branch or deliberate invocation; no deployment job.
on:
  workflow_dispatch:
  push:
    branches: [qualification/native-x64-20260929]

permissions:
  contents: read

concurrency:
  group: native-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native journal ${{ matrix.platform }} (functional only)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      TMPDIR: /tmp
      NATIVE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Record exact host and candidate
        run: |
          export PROOF="$RUNNER_TEMP/native-x64-evidence"
          echo "PROOF=$PROOF" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PROOF"
          node scripts/lib/native-x64-qualification.mjs baseline "$PROOF"
          {
            node --version
            pnpm --version
            bun --version
            cc --version
          } > "$PROOF/toolchain.txt"
      - name: Native dependencies (ephemeral Linux runner)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake pkg-config libevent-dev libncurses-dev ncurses-base ncurses-term libutf8proc-dev bison patchelf
      - name: Native dependencies (ephemeral Intel macOS runner)
        if: runner.os == 'macOS'
        run: |
          brew install automake autoconf pkg-config libevent ncurses utf8proc
          echo "PKG_CONFIG_PATH=$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install source test dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false
      - name: Checkout exact upstream and record patches
        run: |
          repository="$(node -p 'require("./native/tmux/provenance.json").repository')"
          commit="$(node -p 'require("./native/tmux/provenance.json").commit')"
          git init --quiet "$RUNNER_TEMP/native-upstream"
          git -C "$RUNNER_TEMP/native-upstream" remote add origin "$repository"
          git -C "$RUNNER_TEMP/native-upstream" fetch --depth=1 origin "$commit"
          git -C "$RUNNER_TEMP/native-upstream" checkout --detach FETCH_HEAD
          cp native/tmux/provenance.json "$PROOF/provenance.json"
          node --input-type=module -e 'import {readTmuxNativePatches} from "./scripts/lib/tmux-native-patches.mjs"; import {readFileSync} from "node:fs"; readTmuxNativePatches(JSON.parse(readFileSync("native/tmux/provenance.json")), "native/tmux");'
      - name: ASan and UBSan journal adversarial suites
        run: |
          node scripts/test-tmux-interaction-native.mjs --source "$RUNNER_TEMP/native-upstream" --evidence-dir "$PROOF/native-sanitizer" 2>&1 | tee "$PROOF/sanitizer.log"
          touch "$PROOF/sanitizer-passed"
      - name: Build production native dependency closure and smoke probe
        run: node scripts/build-bundled-tmux.mjs --source "$RUNNER_TEMP/native-upstream" --output "$PROOF/bundle" --jobs 2 2>&1 | tee "$PROOF/production.log"
      - name: Execute every selected native daemon test without skips
        run: |
          export TMUX_IDE_NATIVE_JOURNAL_TEST_BINARY="$PROOF/bundle/tmux"
          export TMUX_IDE_REQUIRE_NATIVE_CAPABILITIES=1
          export PATH="$PROOF/bundle:$PATH"
          unset TMUX TMUX_PANE
          suites=()
          while IFS= read -r suite; do suites+=("$suite"); done < <(node scripts/lib/native-x64-qualification.mjs suites "$PROOF")
          test "${#suites[@]}" -eq 10
          pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts "${suites[@]}" --reporter=default --reporter=json --outputFile.json="$PROOF/vitest.json" 2>&1 | tee "$PROOF/daemon.log"
          node scripts/lib/native-x64-qualification.mjs verify "$PROOF"
      - name: Prepare independent physical-cell oracle evidence
        id: oracle
        run: |
          node --test scripts/lib/native-oracle-qualification.test.mjs
          root="$(node scripts/lib/native-oracle-qualification.mjs prepare "$PROOF")"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Execute independent physical-cell oracle
        run: |
          export TMPDIR="${{ steps.oracle.outputs.root }}"
          export TMUX_IDE_BOUNDARY_TEST_BINARY="$PROOF/bundle/tmux"
          export TMUX_IDE_ORACLE_EXPECT_NATIVE=1
          export TMUX_IDE_ORACLE_SOURCE_RECEIPT="$PROOF/bundle/manifest.json"
          unset TMUX TMUX_PANE
          pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/terminal/mirror/native-physical-cell-oracle-live.test.ts --reporter=default --reporter=json --outputFile.json="$PROOF/oracle/vitest.json" 2>&1 | tee "$PROOF/oracle/test.log"
      - name: Retain and strictly verify oracle receipts including failures
        if: ${{ always() && steps.oracle.outcome == 'success' }}
        run: node scripts/lib/native-oracle-qualification.mjs collect "$PROOF"
      - name: Record cleanup independently of test success
        if: always()
        run: node scripts/lib/native-x64-qualification.mjs cleanup "$PROOF"
      - name: Retain exact native closure and bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-journal-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-x64-evidence
          if-no-files-found: error
          retention-days: 7
