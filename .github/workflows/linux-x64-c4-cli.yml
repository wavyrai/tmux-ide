name: Linux x64 offline CLI preparation only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-x64-c4-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cb6f09efb173d045d2bc221d0f14cfe415075b48
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing inputs and prepare offline CLI once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qualification/linux-x64-c4-cli/runner.py
      - name: Independently finish exact-owned container cleanup
        if: always()
        run: python3 qualification/linux-x64-c4-cli/cleanup.py
      - name: Retain unreviewed CLI preparation and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-x64-c4-cli-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/x64-cli-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
