name: Release

# Single source of truth for npm releases. Triggered by a semver tag push
# (`vX.Y.Z`), a manual `workflow_dispatch`, or the explicit handoff from the
# manually-run binary workflow. The dispatch always runs from the release tag,
# so the npm package and downloadable runtimes share one commit.
#
# Scope: npm — the terminal-first CLI/daemon plus its hidden macOS notification
# sender (not a standalone desktop product).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.5.0)"
        required: true
      qualification_only:
        description: "Qualify bundled tmux without publishing npm"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build_macos_notifier:
    name: Build native macOS notifier
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name, '-') }}
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build universal notifier app
        run: node scripts/build-macos-notifier.mjs --version "${{ steps.release.outputs.version }}"

      - name: Verify signature, architectures, and adaptive icon
        shell: bash
        run: |
          app="packages/daemon/dist/native/TmuxIdeNotifier.app"
          codesign --verify --deep --strict "$app"
          archs="$(xcrun lipo -archs "$app/Contents/MacOS/tmux-ide-notifier")"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          xcrun assetutil --info "$app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/assets.json"
          node -e 'const fs=require("node:fs"); const assets=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const actual=new Set(assets.filter((item)=>item.AssetType==="IconGroup").map((item)=>item.Appearance)); for (const expected of ["NSAppearanceNameAqua", "NSAppearanceNameDarkAqua"]) if (!actual.has(expected)) throw new Error(`missing real ${expected} IconGroup`);' "$RUNNER_TEMP/assets.json"

      - name: Archive app bundle
        run: |
          tar -C packages/daemon/dist/native -czf "$RUNNER_TEMP/tmux-ide-macos-notifier.tar.gz" TmuxIdeNotifier.app

      - name: Upload notifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmux-ide-macos-notifier
          path: ${{ runner.temp }}/tmux-ide-macos-notifier.tar.gz
          if-no-files-found: error
          retention-days: 1

  build_bundled_tmux:
    name: Build bundled tmux (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-26 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: linux-x64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf pkg-config libevent ncurses utf8proc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake pkg-config libevent-dev libncurses-dev ncurses-base ncurses-term libutf8proc-dev bison patchelf
      - name: Checkout pinned tmux source
        uses: actions/checkout@v4
        with:
          repository: tmux/tmux
          ref: e476c1230b958df0cb12977517d24b3dc931375b
          path: .native-tmux-source
      - name: Build private tmux with bundled libraries
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig"
          fi
          node scripts/build-bundled-tmux.mjs --source .native-tmux-source
          tar -C packages/daemon/dist/native -czf "$RUNNER_TEMP/tmux-ide-native-tmux-${{ matrix.platform }}.tar.gz" tmux
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'macOS'
        with:
          bun-version-file: .bun-version
      - name: Install qualification dependencies
        run: pnpm install --frozen-lockfile
      - name: Qualify exact bundled tmux boundary
        id: tmux_boundary
        shell: bash
        run: |
          set -euo pipefail
          # Short private path keeps macOS AF_UNIX fixture sockets representable.
          proof="$(mktemp -d /tmp/tmb.XXXXXX)"
          echo "evidence=$proof" >> "$GITHUB_OUTPUT"
          mkdir "$proof/tmp"
          export TMPDIR="$proof/tmp"
          git rev-parse HEAD > "$proof/commit.txt"
          node --version > "$proof/node-version.txt"
          cp native/tmux/provenance.json "$proof/provenance.json"
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          cp "$bundle/manifest.json" "$proof/bundle-manifest.json"
          test -x "$bundle/tmux"
          unset TMUX TMUX_PANE
          export TMUX_IDE_BOUNDARY_TEST_BINARY="$bundle/tmux"
          export TMUX_IDE_ORACLE_EXPECT_NATIVE=1
          export TMUX_IDE_REQUIRE_NATIVE_CAPABILITIES=1
          export PATH="$bundle:$PATH"
          pnpm test:tmux-boundary 2>&1 | tee "$proof/boundary.log"
      - name: Retain bundled boundary reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-boundary-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ steps.tmux_boundary.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
      - name: Prepare disposable macOS SSH account
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { userInfo } from 'node:os';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const receipt = { before: userInfo(), directoryShell: null, after: null, failure: null, success: false };
          try {
            if (process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_ENVIRONMENT !== 'github-hosted' ||
                process.platform !== 'darwin' || process.getuid() === 0 ||
                !/^[A-Za-z0-9_][A-Za-z0-9_.-]*$/.test(receipt.before.username))
              throw new Error('Requires a disposable hosted macOS non-root account');
            if (receipt.before.shell !== '/bin/zsh')
              execFileSync('/usr/bin/sudo', ['-n', '/usr/bin/dscl', '.', '-create',
                `/Users/${receipt.before.username}`, 'UserShell', '/bin/zsh'], { timeout: 10000 });
            receipt.directoryShell = execFileSync('/usr/bin/dscl', ['.', '-read',
              `/Users/${receipt.before.username}`, 'UserShell'],
              { encoding: 'utf8', timeout: 10000, maxBuffer: 65536 }).trim();
            if (receipt.directoryShell !== 'UserShell: /bin/zsh')
              throw new Error('Directory account shell verification failed');
            // Verify through a fresh process after directory mutation. A hosted
            // rerun must establish this result; same-process lookup is not proof.
            receipt.after = JSON.parse(execFileSync(process.execPath, ['--input-type=module', '-e',
              "import { userInfo } from 'node:os'; process.stdout.write(JSON.stringify(userInfo()));"],
              { encoding: 'utf8', timeout: 10000, maxBuffer: 65536 }));
            if (receipt.after.uid !== receipt.before.uid || receipt.after.username !== receipt.before.username ||
                receipt.after.shell !== '/bin/zsh') throw new Error('SSH account shell verification failed');
            receipt.success = true;
          } catch (error) {
            receipt.failure = {
              name: String(error?.name ?? 'Error').slice(0, 256),
              message: String(error?.message ?? error).slice(0, 2048),
              status: Number.isInteger(error?.status) ? error.status : null,
              signal: typeof error?.signal === 'string' ? error.signal : null,
            };
            throw error;
          } finally {
            writeFileSync(join(process.env.RUNNER_TEMP, 'styled-ssh-account.json'), JSON.stringify(receipt, null, 2));
            console.log(JSON.stringify(receipt));
          }
          NODE

      - name: Require styled SSH renderer qualification on macOS
        if: runner.os == 'macOS'
        id: styled_ssh
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/styled-ssh-evidence"
          echo "evidence=$proof" >> "$GITHUB_OUTPUT"
          # sshd StrictModes requires safe ancestry; /tmp is unsuitable.
          export TMPDIR="$(getconf DARWIN_USER_TEMP_DIR)"
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          pnpm qualify:styled-ssh --binary "$bundle/tmux" --manifest "$bundle/manifest.json" --bun "$(command -v bun)" --evidence-dir "$proof"
      - name: Retain styled SSH evidence including failures
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: styled-ssh-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/styled-ssh-evidence
            ${{ runner.temp }}/styled-ssh-account.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify installer transactions on this platform
        run: pnpm test:installer
      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        run: |
          # Ephemeral CI runner only. The product never changes login lingering.
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Qualify installed daemon service and session preservation
        run: |
          pnpm build:cli
          node scripts/qualify-daemon-service.mjs "$RUNNER_TEMP/daemon-service-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-service-${{ matrix.platform }}
          path: ${{ runner.temp }}/daemon-service-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify published installer transactions and managed rollback
        if: ${{ inputs.qualification_only }}
        timeout-minutes: 35
        run: node scripts/qualify-installer-service.mjs "$RUNNER_TEMP/installer-service"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.qualification_only }}
        with:
          name: installer-service-${{ matrix.platform }}
          path: ${{ runner.temp }}/installer-service
          if-no-files-found: error
          retention-days: 14
      - name: Qualify native grid and daemon client transport
        run: |
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          TMUX_IDE_REQUIRE_NATIVE_CAPABILITIES=1 PATH="$bundle:$PATH" pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/tui/mirror/runtime/terminal-native-content-live.test.ts
          TMUX_IDE_NATIVE_GRID_TMUX="$bundle/tmux" pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/terminal/session-runtime/native-backing-owner-live.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmux-ide-native-tmux-${{ matrix.platform }}
          path: ${{ runner.temp }}/tmux-ide-native-tmux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish_npm:
    name: Publish to npm
    needs: [build_macos_notifier, build_bundled_tmux]
    if: ${{ always() && !inputs.qualification_only && needs.build_bundled_tmux.result == 'success' && (needs.build_macos_notifier.result == 'success' || needs.build_macos_notifier.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Setup npm trusted publishing client
        # npm trusted publishing requires npm >= 11.5.1. Pin the release
        # client so the runner image cannot silently fall below that contract.
        run: |
          npm install --global npm@11.6.2
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Align npm package versions
        run: |
          node -e "const fs=require('node:fs'); for (const p of ['package.json','packages/daemon/package.json']) { const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n'); }" "${{ steps.release.outputs.version }}"

      - name: Resolve npm dist-tag
        id: npm
        shell: bash
        run: |
          tag="$(node scripts/lib/npm-release-tag.mjs "${{ steps.release.outputs.version }}")"
          echo "Publishing ${{ steps.release.outputs.version }} on npm dist-tag '$tag'."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download bundled tmux
        uses: actions/download-artifact@v4
        with:
          pattern: tmux-ide-native-tmux-*
          merge-multiple: true
          path: ${{ runner.temp }}/tmux-ide-native-tmux
      - name: Include bundled tmux in npm payload
        run: |
          mkdir -p packages/daemon/dist/native
          for archive in "$RUNNER_TEMP"/tmux-ide-native-tmux/*.tar.gz; do
            tar -xzf "$archive" -C packages/daemon/dist/native
          done
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            test -f "packages/daemon/dist/native/tmux/$platform/tmux"
          done

      - name: Use bundled tmux for release checks
        run: echo "$PWD/packages/daemon/dist/native/tmux/linux-x64" >> "$GITHUB_PATH"

      - name: Download native macOS notifier for stable release
        if: steps.npm.outputs.tag == 'latest'
        uses: actions/download-artifact@v4
        with:
          name: tmux-ide-macos-notifier
          path: ${{ runner.temp }}/tmux-ide-macos-notifier

      - name: Add native notifier to stable npm payload
        if: steps.npm.outputs.tag == 'latest'
        run: |
          mkdir -p packages/daemon/dist/native
          tar -xzf "$RUNNER_TEMP/tmux-ide-macos-notifier/tmux-ide-macos-notifier.tar.gz" \
            -C packages/daemon/dist/native
          test -x packages/daemon/dist/native/TmuxIdeNotifier.app/Contents/MacOS/tmux-ide-notifier

      - name: Wait for OpenTUI runtime assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ steps.release.outputs.version }}"
          expected=(
            tmux-ide-tui-darwin-arm64.gz
            tmux-ide-tui-darwin-arm64.gz.sha256
            tmux-ide-tui-darwin-x64.gz
            tmux-ide-tui-darwin-x64.gz.sha256
            tmux-ide-tui-linux-arm64.gz
            tmux-ide-tui-linux-arm64.gz.sha256
            tmux-ide-tui-linux-x64.gz
            tmux-ide-tui-linux-x64.gz.sha256
          )
          for attempt in $(seq 1 60); do
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=0
            for name in "${expected[@]}"; do
              grep -Fxq "$name" <<<"$assets" || missing=1
            done
            if [[ "$missing" -eq 0 ]]; then
              echo "All exact-version OpenTUI runtimes are available for $tag."
              exit 0
            fi
            echo "OpenTUI runtimes not complete yet (attempt $attempt/60); retrying in 10s."
            sleep 10
          done
          echo "OpenTUI runtime assets are incomplete for $tag; refusing to publish npm." >&2
          exit 1

      - name: Verify OpenTUI runtime release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          tag="v${version}"
          expected_commit="$(git rev-parse HEAD)"
          refs="$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}")"
          direct="$(awk -v ref="refs/tags/${tag}" '$2 == ref { print $1; exit }' <<< "$refs")"
          peeled="$(awk -v ref="refs/tags/${tag}^{}" '$2 == ref { print $1; exit }' <<< "$refs")"
          tag_commit="${peeled:-$direct}"
          if [[ -z "$tag_commit" || "$tag_commit" != "$expected_commit" ]]; then
            echo "Refusing npm publish: $tag resolves to ${tag_commit:-unknown}, not checked-out commit $expected_commit." >&2
            exit 1
          fi

          manifests="$(mktemp -d)"
          trap 'rm -rf "$manifests"' EXIT
          gh release download "$tag" --pattern '*.gz.sha256' --dir "$manifests"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            manifest="$manifests/tmux-ide-tui-${platform}.gz.sha256"
            test -s "$manifest" || {
              echo "Missing checksum manifest for $platform." >&2
              exit 1
            }
            grep -Fx "version $version" "$manifest" >/dev/null || {
              echo "Checksum manifest for $platform does not identify version $version." >&2
              exit 1
            }
            grep -Fx "platform $platform" "$manifest" >/dev/null || {
              echo "Checksum manifest for $platform has the wrong platform identity." >&2
              exit 1
            }
            grep -Fx "commit $expected_commit" "$manifest" >/dev/null || {
              echo "Checksum manifest for $platform does not identify checked-out commit $expected_commit." >&2
              exit 1
            }
          done
          echo "Verified $tag and all OpenTUI manifests at $expected_commit."

      - name: Run focused OpenTUI release checks
        # The complete contributor gate remains `pnpm check`, but npm publishes
        # the terminal-first CLI/daemon product for both prerelease and stable
        # tags. Qualify that exact package journey here. Deferred Web GUI,
        # Electron, and product-rig breadth remain independent CI signals and
        # cannot block an OpenTUI beta or GM cut. Stable releases still require
        # the native notifier artifact and exact runtime provenance above.
        run: pnpm run release:opentui:check

      - name: Build daemon
        # Compile packages/daemon/src → packages/daemon/dist so the
        # root `tmux-ide` tarball (files: ["packages/daemon/dist"]) ships
        # the daemon without needing a separate @tmux-ide/daemon publish.
        working-directory: packages/daemon
        run: pnpm exec tsc -p tsconfig.json

      - name: Publish tmux-ide
        # The `npm` GitHub environment is registered as this package's trusted
        # publisher on npm. OIDC removes the expiring automation-token failure
        # mode while `id-token: write` supplies signed provenance.
        run: npm publish --access public --tag "${{ steps.npm.outputs.tag }}"

  # Push the just-released version into the Homebrew tap
  # (wavyrai/homebrew-tap → Formula/tmux-ide.rb). The formula's source of
  # truth is packaging/homebrew/Formula/tmux-ide.rb in THIS repo; this job
  # rewrites its url + sha256 to the fresh npm tarball and pushes the result.
  #
  # Gated to a graceful no-op until two one-time setup steps exist:
  #   1. the `wavyrai/homebrew-tap` GitHub repo (empty is fine — this job
  #      creates Formula/tmux-ide.rb on first run), and
  #   2. a `TAP_PUSH_TOKEN` repo secret: a fine-grained PAT with contents
  #      read/write on wavyrai/homebrew-tap.
  bump_tap:
    name: Bump Homebrew tap
    needs: publish_npm
    runs-on: ubuntu-24.04
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate on tap secret
        id: gate
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          npm_tag="$(node scripts/lib/npm-release-tag.mjs "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$npm_tag" != "latest" ]]; then
            echo "Prerelease v$version uses npm dist-tag '$npm_tag'; leaving stable Homebrew unchanged."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "${TAP_PUSH_TOKEN}" ]]; then
            echo "TAP_PUSH_TOKEN not set — skipping tap bump (create wavyrai/homebrew-tap and add the secret to enable)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the npm tarball and compute its sha256
        if: steps.gate.outputs.enabled == 'true'
        id: tarball
        shell: bash
        run: |
          version="${{ steps.gate.outputs.version }}"
          url="https://registry.npmjs.org/tmux-ide/-/tmux-ide-${version}.tgz"
          # The registry can lag the publish by a little; poll up to 5 minutes.
          for i in $(seq 1 30); do
            if curl -fsSL -o tmux-ide.tgz "$url"; then break; fi
            echo "tarball not visible yet (attempt $i/30) — retrying in 10s"
            sleep 10
          done
          [[ -s tmux-ide.tgz ]] || { echo "npm tarball never appeared: $url" >&2; exit 1; }
          sha="$(sha256sum tmux-ide.tgz | cut -d' ' -f1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update formula and push to the tap
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.gate.outputs.version }}"
          url="${{ steps.tarball.outputs.url }}"
          sha="${{ steps.tarball.outputs.sha256 }}"
          if ! git clone --depth 1 "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/wavyrai/homebrew-tap.git" tap; then
            echo "wavyrai/homebrew-tap does not exist (or the token cannot read it) — skipping tap bump."
            exit 0
          fi
          mkdir -p tap/Formula
          sed -E \
            -e "s#^(  url \").*(\")\$#\\1${url}\\2#" \
            -e "s#^(  sha256 \").*(\")\$#\\1${sha}\\2#" \
            packaging/homebrew/Formula/tmux-ide.rb > tap/Formula/tmux-ide.rb
          cd tap
          git add Formula/tmux-ide.rb
          if git diff --cached --quiet; then
            echo "Formula already at v${version} — nothing to push."
            exit 0
          fi
          git -c user.name="tmux-ide release bot" \
              -c user.email="noreply@wavyr.com" \
              commit -m "tmux-ide ${version}"
          git push origin HEAD
