name: Diagnose ARM64 terminal seed

# Temporary diagnostic branch only. No publication jobs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.5.0)"
        required: true
      qualification_only:
        description: "Qualify bundled tmux without publishing npm"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build_bundled_tmux:
    name: Build bundled tmux (${{ matrix.platform }})
    # Intel macOS (darwin-x64) is unsupported as of 2.9.6.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf pkg-config libevent ncurses utf8proc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake pkg-config libevent-dev libncurses-dev ncurses-base ncurses-term libutf8proc-dev bison patchelf
      - name: Checkout pinned tmux source
        uses: actions/checkout@v4
        with:
          repository: tmux/tmux
          ref: e476c1230b958df0cb12977517d24b3dc931375b
          path: .native-tmux-source
      - name: Build private tmux with bundled libraries
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig"
          fi
          node scripts/build-bundled-tmux.mjs --source .native-tmux-source
          tar -C packages/daemon/dist/native -czf "$RUNNER_TEMP/tmux-ide-native-tmux-${{ matrix.platform }}.tar.gz" tmux
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'macOS'
        with:
          bun-version-file: .bun-version
      - name: Install qualification dependencies
        run: pnpm install --frozen-lockfile
      - name: Qualify exact bundled tmux boundary
        id: tmux_boundary
        shell: bash
        run: |
          set -euo pipefail
          # Short private path keeps macOS AF_UNIX fixture sockets representable.
          proof="$(mktemp -d /tmp/tmb.XXXXXX)"
          echo "evidence=$proof" >> "$GITHUB_OUTPUT"
          mkdir "$proof/tmp"
          export TMPDIR="$proof/tmp"
          git rev-parse HEAD > "$proof/commit.txt"
          node --version > "$proof/node-version.txt"
          cp native/tmux/provenance.json "$proof/provenance.json"
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          cp "$bundle/manifest.json" "$proof/bundle-manifest.json"
          test -x "$bundle/tmux"
          unset TMUX TMUX_PANE
          export TMUX_IDE_BOUNDARY_TEST_BINARY="$bundle/tmux"
          export TMUX_IDE_ORACLE_EXPECT_NATIVE=1
          export TMUX_IDE_REQUIRE_NATIVE_CAPABILITIES=1
          export PATH="$bundle:$PATH"
          pnpm test:tmux-boundary 2>&1 | tee "$proof/boundary.log"
          # Compare the unchanged release fixture on this same hosted runner.
          fixture=packages/daemon/src/tui/mirror/runtime/terminal-input-session-replacement-live.test.ts
          cp "$fixture" "$proof/instrumented-fixture.ts"
          git fetch --depth=1 origin tag v2.9.15
          git show v2.9.15:"$fixture" > "$fixture"
          for attempt in $(seq 1 20); do
            if ! pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/tui/mirror/runtime/terminal-input-session-replacement-live.test.ts > "$proof/original-$attempt.log" 2>&1; then
              cat "$proof/original-$attempt.log"
              cp "$proof/instrumented-fixture.ts" "$fixture"
              pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/tui/mirror/runtime/terminal-input-session-replacement-live.test.ts > "$proof/instrumented-after-failure.log" 2>&1 || true
              exit 1
            fi
          done
          cp "$proof/instrumented-fixture.ts" "$fixture"
      - name: Qualify native split ownership and bridge gestures
        timeout-minutes: 15
        shell: bash
        env:
          SPLIT_PROOF: ${{ steps.tmux_boundary.outputs.evidence }}
        run: |
          set -euo pipefail
          test -d "$SPLIT_PROOF"
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          test -x "$bundle/tmux"
          # Every fixture owns a private socket and HOME; never use the default server.
          python3 --version > "$SPLIT_PROOF/python-version.txt"
          python3 native/tmux/tests/split-resize.py "$bundle/tmux" 2>&1 | tee "$SPLIT_PROOF/split-native.log"
          python3 native/tmux/tests/split-membership-regression.py "$bundle/tmux" 2>&1 | tee "$SPLIT_PROOF/split-membership.log"
          node --import tsx native/tmux/tests/split-guarded-runner.mjs "$bundle/tmux" 2>&1 | tee "$SPLIT_PROOF/split-guarded.log"
          node --import tsx native/tmux/tests/split-owner-runner.mjs "$bundle/tmux" 2>&1 | tee "$SPLIT_PROOF/split-owner.log"
          node --import tsx apps/tmux-gpui/bridge/split-gesture-smoke.mjs "$bundle/tmux" 2>&1 | tee "$SPLIT_PROOF/split-bridge.log"
      - name: Retain bundled boundary reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-boundary-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ steps.tmux_boundary.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
      - name: Prepare disposable macOS SSH account
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { userInfo } from 'node:os';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const receipt = { before: userInfo(), directoryShell: null, after: null, exportedShell: null, failure: null, success: false };
          try {
            if (process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_ENVIRONMENT !== 'github-hosted' ||
                process.platform !== 'darwin' || process.getuid() === 0 ||
                !/^[A-Za-z0-9_][A-Za-z0-9_.-]*$/.test(receipt.before.username))
              throw new Error('Requires a disposable hosted macOS non-root account');
            if (receipt.before.shell !== '/bin/zsh')
              execFileSync('/usr/bin/sudo', ['-n', '/usr/bin/dscl', '.', '-create',
                `/Users/${receipt.before.username}`, 'UserShell', '/bin/zsh'], { timeout: 10000 });
            receipt.directoryShell = execFileSync('/usr/bin/dscl', ['.', '-read',
              `/Users/${receipt.before.username}`, 'UserShell'],
              { encoding: 'utf8', timeout: 10000, maxBuffer: 65536 }).trim();
            if (receipt.directoryShell !== 'UserShell: /bin/zsh')
              throw new Error('Directory account shell verification failed');
            // Verify through a fresh process after directory mutation. A hosted
            // rerun must establish this result; same-process lookup is not proof.
            receipt.after = JSON.parse(execFileSync(process.execPath, ['--input-type=module', '-e',
              "import { userInfo } from 'node:os'; process.stdout.write(JSON.stringify(userInfo()));"],
              { encoding: 'utf8', timeout: 10000, maxBuffer: 65536 }));
            if (receipt.after.uid !== receipt.before.uid || receipt.after.username !== receipt.before.username ||
                receipt.after.shell !== '/bin/zsh') throw new Error('SSH account shell verification failed');
            // Bun's userInfo shell follows SHELL. Propagate only the account
            // value independently verified above to subsequent hosted steps.
            appendFileSync(process.env.GITHUB_ENV, 'SHELL=/bin/zsh\n');
            receipt.exportedShell = '/bin/zsh';
            receipt.success = true;
          } catch (error) {
            receipt.failure = {
              name: String(error?.name ?? 'Error').slice(0, 256),
              message: String(error?.message ?? error).slice(0, 2048),
              status: Number.isInteger(error?.status) ? error.status : null,
              signal: typeof error?.signal === 'string' ? error.signal : null,
            };
            throw error;
          } finally {
            writeFileSync(join(process.env.RUNNER_TEMP, 'styled-ssh-account.json'), JSON.stringify(receipt, null, 2));
            console.log(JSON.stringify(receipt));
          }
          NODE

      - name: Require styled SSH renderer qualification on macOS
        if: runner.os == 'macOS'
        id: styled_ssh
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/styled-ssh-evidence"
          echo "evidence=$proof" >> "$GITHUB_OUTPUT"
          # sshd StrictModes requires safe ancestry; /tmp is unsuitable.
          export TMPDIR="$(getconf DARWIN_USER_TEMP_DIR)"
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          pnpm qualify:styled-ssh --binary "$bundle/tmux" --manifest "$bundle/manifest.json" --bun "$(command -v bun)" --evidence-dir "$proof"
      - name: Retain styled SSH evidence including failures
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: styled-ssh-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/styled-ssh-evidence
            ${{ runner.temp }}/styled-ssh-account.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify installer transactions on this platform
        run: pnpm test:installer
      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        run: |
          # Ephemeral CI runner only. The product never changes login lingering.
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Qualify installed daemon service and session preservation
        run: |
          pnpm build:cli
          node scripts/qualify-daemon-service.mjs "$RUNNER_TEMP/daemon-service-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-service-${{ matrix.platform }}
          path: ${{ runner.temp }}/daemon-service-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify published installer transactions and managed rollback
        if: ${{ inputs.qualification_only }}
        timeout-minutes: 35
        run: node scripts/qualify-installer-service.mjs "$RUNNER_TEMP/installer-service"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.qualification_only }}
        with:
          name: installer-service-${{ matrix.platform }}
          path: ${{ runner.temp }}/installer-service
          if-no-files-found: error
          retention-days: 14
      - name: Qualify native grid and daemon client transport
        run: |
          bundle="$PWD/packages/daemon/dist/native/tmux/$(node -p 'process.platform + "-" + process.arch')"
          TMUX_IDE_REQUIRE_NATIVE_CAPABILITIES=1 PATH="$bundle:$PATH" pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/tui/mirror/runtime/terminal-native-content-live.test.ts
          TMUX_IDE_NATIVE_GRID_TMUX="$bundle/tmux" pnpm --filter @tmux-ide/daemon exec vitest run --config vitest.live.config.ts src/terminal/session-runtime/native-backing-owner-live.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmux-ide-native-tmux-${{ matrix.platform }}
          path: ${{ runner.temp }}/tmux-ide-native-tmux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1
