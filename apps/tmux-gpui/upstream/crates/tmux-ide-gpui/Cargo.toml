[package]
default-run = "tmux-ide-gpui"
edition.workspace      = true
license.workspace      = true
name                   = "tmux-ide-gpui"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
bezel_theme.workspace = true
bezel_ui.workspace = true
url.workspace = true
anyhow.workspace               = true
flate2.workspace               = true
gpui.workspace                 = true
# Unlike gpui 0.2.2, the platform crate enables nothing by default: without
# font-kit (macOS) or a Linux backend, text silently goes to a no-op system.
gpui_platform                  = { features = ["font-kit", "runtime_shaders", "wayland", "x11"], workspace = true }
herdr-client.workspace         = true
image                          = { features = ["bmp", "tiff"], workspace = true }
nucleo-matcher.workspace       = true
serde.workspace                = true
serde_json                     = { workspace = true, features = ["raw_value"] }
sha2.workspace                 = true
skrifa.workspace               = true
tempfile.workspace             = true
thiserror.workspace            = true
toml.workspace                 = true
tracing.workspace              = true
unicode-width.workspace        = true
ureq.workspace                 = true
uuid.workspace                 = true

[dev-dependencies]
base64.workspace = true
tungstenite.workspace = true
gpui = { features = ["test-support"], workspace = true }

[features]
default = []
integration-test = ["objc2-app-kit/NSPasteboardItem"]
# Dev-only offscreen window screenshots (examples/capture_window.rs). Never in release.
visual-capture = ["gpui_platform/test-support"]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fontdb.workspace       = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple.workspace = true
tmux-native-surface-sdk.workspace = true
objc2-core-video.workspace = true
block2.workspace                = true
objc2-core-foundation.workspace = true
objc2.workspace              = true
objc2-app-kit                = { workspace = true, features = ["NSColor", "NSAppearance", "NSWorkspace", "NSAccessibility", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation             = { workspace = true, features = ["NSNotification", "NSOperation", "block2"] }
raw-window-handle.workspace  = true

# tmux-ide native entry.
[[bin]]
name = "tmux-ide-gpui"
path = "src/tmux_main.rs"

[[example]]
name = "tmux_native_journey"
required-features = ["integration-test"]

[[example]]
name = "capture_window"
required-features = ["visual-capture"]
