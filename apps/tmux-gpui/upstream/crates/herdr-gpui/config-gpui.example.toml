# client_secret = ""  # or GEMINI_OAUTH_CLIENT_SECRET
#
# Antigravity (antigravity)
# [usage.providers.antigravity]
#   The agy executable on the probed host when it is not on the PATH (install it
#   with `brew install --cask antigravity-cli`, run `agy` once, and sign in).
#   agy runs only when this is set or antigravity is in show_providers, as a
#   signed-out agy opens a browser to sign in.
# cli_path = ""  # or ANTIGRAVITY_CLI_PATH
#
# Copilot (copilot)
# [usage.providers.copilot]
#   A GitHub token of the account with Copilot, e.g. a fine-grained personal
#   access token from https://github.com/settings/personal-access-tokens with no
#   extra permissions, or the output of `gh auth token`. Not needed when a
#   Copilot editor plugin is signed in on the host.
# token = ""  # or COPILOT_API_TOKEN
#   For GitHub Enterprise Cloud with data residency: the host, such as
#   octocorp.ghe.com. Usage is then read from api.<host>.
# enterprise_host = ""
#
# Devin (devin)
# [usage.providers.devin]
#   Sign in to https://app.devin.ai, open your organization's Usage & Limits
#   page, then in Developer Tools > Network select the successful
#   billing/quota/usage request and copy its Authorization request header
#   without the leading "Bearer ". The value is a browser session token and
#   expires with that session.
# token = ""  # or DEVIN_BEARER_TOKEN
#   The x-cog-org-id request header of the same request (an org-… or org_…
#   id). An organization slug or its app.devin.ai URL also works.
# organization = ""  # or DEVIN_ORGANIZATION, DEVIN_ORG
#
# z.ai / GLM (zai)
# [usage.providers.zai]
#   A z.ai API key from https://z.ai/manage-apikey/apikey-list, or for BigModel
#   China one from https://bigmodel.cn/usercenter/proj-mgmt/apikeys.
# api_key = ""  # or Z_AI_API_KEY
#   "global" for api.z.ai (the default) or "bigmodel-cn" for open.bigmodel.cn,
#   the China mainland GLM Coding Plan.
# region = ""
#   An HTTPS host that replaces the region's API host, e.g. a proxy.
# api_host = ""  # or Z_AI_API_HOST
#   A full HTTPS URL that replaces the quota endpoint.
# quota_url = ""  # or Z_AI_QUOTA_URL
#   A full HTTPS URL that replaces the BigModel China balance endpoint.
# balance_url = ""  # or Z_AI_BALANCE_URL
#   "personal" (the default) or "team" for BigModel team usage, which also needs
#   organization and project.
# usage_scope = ""
#   For team usage: open https://bigmodel.cn/coding-plan/team/usage-stats, pick
#   the team, and in Developer Tools > Network copy the Bigmodel-Organization
#   request header of the quota/limit request.
# organization = ""  # or Z_AI_BIGMODEL_ORGANIZATION
#   For team usage: the Bigmodel-Project request header of the same request.
# project = ""  # or Z_AI_BIGMODEL_PROJECT
#
# MiniMax (minimax)
# [usage.providers.minimax]
#   A MiniMax Coding Plan or Token Plan API key (sk-cp-…) from
#   https://platform.minimax.io/user-center/basic-information/interface-key.
# api_key = ""  # or MINIMAX_CODING_API_KEY, MINIMAX_API_KEY
