# cookie = ""
#
# JetBrains AI (jetbrains)
# [usage.providers.jetbrains]
#   The config directory of the IDE to read, when the most recently used one is
#   not the right one, e.g. "~/Library/Application
#   Support/JetBrains/IntelliJIdea2025.3" on a Mac or
#   "~/.config/JetBrains/PyCharm2025.3" on Linux. Its
#   options/AIAssistantQuotaManager2.xml appears once AI Assistant has been
