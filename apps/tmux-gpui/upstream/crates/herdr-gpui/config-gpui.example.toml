# api_key = ""  # or KILO_API_KEY
#
# Vertex AI (vertexai)
# [usage.providers.vertexai]
#   The Google Cloud project id whose Vertex AI quotas to read, when gcloud has
#   none set (`gcloud config set project PROJECT_ID`). Sign in with `gcloud auth
#   application-default login`; the account needs Cloud Monitoring read access
#   (roles/monitoring.viewer) on the project.
# project = ""  # or GOOGLE_CLOUD_PROJECT, GCLOUD_PROJECT, CLOUDSDK_CORE_PROJECT
#
# Augment (augment)
# [usage.providers.augment]
#   Your app.augmentcode.com browser session, used when the Auggie CLI is not
#   signed in. Sign in at https://app.augmentcode.com, open Developer Tools →
