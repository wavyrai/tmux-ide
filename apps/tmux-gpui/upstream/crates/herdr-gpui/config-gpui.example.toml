# api_key = ""  # or KIMI_CODE_API_KEY
#   Which Kimi service the credentials belong to: "china" (the default,
#   kimi.com) or "international" (kimi.ai). Moonshot Open Platform keys belong
#   to the moonshot provider instead.
# region = ""
