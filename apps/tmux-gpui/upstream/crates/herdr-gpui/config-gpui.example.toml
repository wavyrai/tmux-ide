# DO NOT EDIT -- WILL BE OVERWRITTEN
# Managed Herdr GPUI defaults, refreshed on startup and GUI config reload.
# Put your overrides in config-gpui.local.toml beside this file.
# Herdr GUI settings. Independent of the daemon config, except where a setting
# below says it starts from one the daemon config already carries.
# Save at $XDG_CONFIG_HOME/herdr/config-gpui.toml (default ~/.config/herdr/).
# Omitted settings use defaults. Keys this build does not know, such as ones a
# newer build reads, are ignored and named in a dismissible warning instead of
# failing the load. [github] credentials are still refused.
# Font sizes are logical pixels, inclusive 8..48.
# Font families below are examples; leave them commented to use platform defaults.
# Fonts must be installed locally; none are bundled.
# Powerline separators and Nerd Font icons live in the Private Use Area, which
# no text face covers. Each section falls back to the installed "Nerd Font"
# families automatically; set fallback to choose them yourself, or to [] for
# none. Uninstalled names are ignored, and at most 8 are accepted per section.
# Saved changes to the local file reload automatically in every GUI window.

# Built-ins: Default, Nord, Dracula, Catppuccin Mocha, Catppuccin Latte.
# Also accepts a Ghostty theme name, an absolute path, or a ~/ path.
# Set "Follow Herdr" in config-gpui.local.toml to follow the local Herdr theme.
# To follow the system light/dark appearance, name a theme for each side, as
# Ghostty does: theme = "light:Catppuccin Latte,dark:Catppuccin Mocha"
theme = "Default"
# How far the app's own colors (status dots, pull request badges, diff counts,
# warnings, dim labels) stand off the sidebar and menus. "standard" moves a
# color only when it would fall below 3:1, as pastels do on light themes.
# "high" raises them and dim labels to 4.5:1 and makes selected rows stand out
# more. Terminal output always keeps its program's colors.
contrast = "standard"

# Ask before closing a tab (closing terminates its terminal processes).
confirm_close_tab = true
# Ask before closing a pane, independently of tabs. The dialog's "Do not ask
# again" checkbox sets this to false in config-gpui.local.toml.
confirm_close_pane = true
# Show the Agents section below Spaces in the sidebar.
show_agents = true
# Show CPU and memory: the selected host's in the status bar, and each host's
# on its sidebar row. Connected remote hosts are read over SSH every couple of
# seconds; false stops all sampling. Also under Settings > Status bar.
show_system_load = true
# Checkpoint a worktree each time one of its agents starts or finishes a turn,
# locally or over SSH, so its files can be rolled back from the workspace
# menu's Checkpoints. Snapshots include untracked (not ignored) files, live in
# hidden refs/herdr-gpui/checkpoints/ refs, and the newest 50 per branch are
# kept. Taking one never changes the index or files. Also under
# Settings > General.
agent_checkpoints = true
# Show the TCP ports each workspace's servers listen on, under its sidebar row
# and in the status bar; click one to open it in a browser tab. Hosts are
# scanned every five seconds with ss or lsof, a remote one over SSH; false
# stops all scanning. Also under Settings > General.
show_listening_ports = true
# macOS only: whether Option-letter reaches a pane as an Alt shortcut (Alt-P
# for Option-P) or types the character the keyboard layout puts there. "auto"
# sends Alt from the left Option on the U.S. and ABC layouts, while the right
# Option still types accents and dead keys (Option-E then E types é); it types
# with both elsewhere, so layouts that keep @, [, or letters on Option still
# type them. "left" or "right" sends Alt from that Option key alone on any
# layout, true from both, and false never. Alt always reaches the pane on
# Linux and Windows.
option_as_alt = "auto"
# Where a clicked terminal link opens: "system" (the default browser) or
# "browser-tab" (a browser tab beside the workspace's terminals, macOS and
# Windows only). Alt-click (Option-click) opens a link in the other one.
open_links_in = "system"
# Keep a terminal selection highlighted after releasing the mouse copies it,
# until the next click or keystroke. Cmd-C and Edit > Copy copy it again, and
# selection tools and screen readers can still read it. false clears it on
# release.
keep_selection_after_copy = true
# "normal" (TUI-like), "comfortable" (the previous roomy Normal), or "compact".
# Compact hides workspace branch lines and PR change
# counts, and tightens Spaces and Agents spacing without changing font sizes.
# Add "-rounded" to any of them ("normal-rounded", "compact-rounded",
# "comfortable-rounded") for inset rows with rounded, bordered highlights.
# "superset" (single-line rows), "orca" (cards), and "minimal" (status and name
# only) draw rows with a design of their own. View > Layout lists them all.
layout = "normal"

[palette]
# Two short Shift taps open the unified palette in the focused GUI window.
# Cmd-Shift-P opens All; Cmd-P starts on Navigation. Ordinary Shift typing and
# selection do not count. Disable the gesture independently of keybindings.
double_shift = true
# Immediate non-hidden subdirectories, including folders without Git metadata.
# Roots expand a leading ~ and $VAR / ${VAR}; unset variables show an error.
# At most 16 roots. Child symlinks are skipped. Local folders open locally,
# never on the selected SSH host. These settings do not read herdr-utils config.
project_roots = []
# Example override: project_roots = ["~/Code", "$HOME/Projects"]

# Inherit shared [ui.toast] delivery, delay_seconds, and herdr.position.
# Only delivery = "herdr" enables in-app toasts; "off", "terminal", and "system"
# do not. QA previews bypass delivery policy. In config-gpui.local.toml, each
# explicit key overrides the shared setting independently, including false.
# [notifications]
# enabled = false
# Inclusive 0..3600. Custom notifications are immediate.
# delay_seconds = 1
# top-left, top-right, bottom-left, bottom-right. Explicit wire corners win.
# position = "bottom-right"

# The "copied to clipboard" flash shown after a terminal selection is copied.
# Left commented out, this follows the daemon config's [ui.toast.clipboard], so
# setting it there covers both clients. Uncomment a key to override that one
# here; each key overrides on its own. Defaults, as in herdr: shown, at the
# bottom center of the terminal.
# [clipboard_toast]
# enabled = true
# top-left, top-center, top-right, bottom-left, bottom-center, bottom-right.
# The position also places the note saying why New Worktree opened no dialog.
# position = "bottom-center"

# What a pane's terminal bell (BEL) does. Herdr has no bell setting of its own:
# it forwards each bell to the focused client, as an outer terminal would see it.
# [bell]
# Bounce the Dock icon while the window is in the background.
# attention = true
# Play the system alert sound.
# sound = false

# To customize spacing too, REPLACE the top-level layout above with this table:
# [layout]
# mode = "normal"
# Blank space between the sidebar and the terminal beside it, 0 to 64.
# The terminal keeps the remaining width, so a wide gap costs columns.
# Ignored while the sidebar is hidden. Set 0 to sit against the divider.
# sidebar_gap = 8

# Native shortcuts. Each key is a command; the value is one keystroke or a list,
# primary first. "" or [] unbinds it. Assigning a keystroke here takes it away
# from its default command. Modifiers: cmd (super on Linux), ctrl, alt, shift,
# fn; keystrokes need at least one of cmd, ctrl, alt, or fn.
# Herdr's own [keys] in config.toml (prefix chords included) add to these
# defaults; a command named here keeps only the keystrokes listed here.
# [keybindings]
# new_tab = "cmd-t"
# new_workspace = "cmd-shift-n"
# new_worktree = "cmd-n"
# new_window = "cmd-alt-shift-n"
# split_right = "cmd-d"
# split_down = "cmd-shift-d"
# next_tab = "cmd-shift-]"
# previous_tab = "cmd-shift-["
# focus_left = "cmd-alt-left"
# focus_right = "cmd-alt-right"
# focus_up = "cmd-alt-up"
# focus_down = "cmd-alt-down"
# next_pane = "cmd-alt-]"
# previous_pane = "cmd-alt-["
# toggle_zoom = "cmd-shift-enter"
# close_pane = "cmd-w"
# close_tab = "cmd-shift-w"
# focus_tab_1 = "cmd-1"   # through focus_tab_9 = "cmd-9"
# toggle_sidebar = "cmd-b"
# toggle_status_bar = "cmd-ctrl-b"   # unbound by default
# increase_font_size = ["cmd-=", "cmd-+"]
# decrease_font_size = "cmd--"
# reset_font_size = "cmd-0"
# settings = "cmd-,"
# keybindings = "cmd-/"
# workspace_picker = "cmd-p"
# command_palette = "cmd-shift-p"
# open_notification_target = "cmd-alt-n"
# quit = "cmd-q"
# find_next = "cmd-g"
# find_previous = "cmd-shift-g"
# toggle_full_screen = "ctrl-cmd-f"
# cycle_windows = "cmd-`"
# Unbound by default: themes, reconnect, logs, about, worktree_notes,
# edit_worktree_note.

# What the focused pane receives instead of a keystroke, as Ghostty's text:
# binds do. The value is a key a terminal can receive (ctrl-a, home, alt-b,
# shift-enter); an empty string removes a default. A keystroke here leaves its
# default or daemon command, but naming it in [keybindings] too is an error.
# On macOS these are the defaults:
# [pane_keys]
# "cmd-left" = "ctrl-a"
# "cmd-right" = "ctrl-e"
# "cmd-backspace" = "ctrl-u"
# "alt-left" = "alt-b"
# "alt-right" = "alt-f"

# Saved SSH devices use the local keybindings above, as `herdr --remote` does.
# "server" uses the [keys] profile that device's Herdr publishes instead, like
# `herdr --remote-keybindings server`; [keybindings] still apply on top. Keyed
# by catalog ID; a device's right-click menu toggles it.
# [devices.0123456789abcdef0123456789abcdef]
# keybindings = "server"

# Preferences offers a searchable picker for all four families together or each row.
# Platform default removes the local family override; fallback cascades remain active.
[sidebar]
# Default: "Menlo" on macOS, "Cascadia Mono" on Windows (Consolas when
# missing), "DejaVu Sans Mono" on Linux (or an installed monospace family such
# as JetBrains Mono when DejaVu is missing).
# family = "DejaVu Sans Mono"
size = 12
# fallback = ["Symbols Nerd Font Mono"]
# Spacing written over the layout chosen above, in logical pixels. Each key
# left out keeps the layout's own value. The indent is how far each nesting
# level steps in: workspaces under their host, worktrees under their
# repository. Bands: indent 0..=48, row_padding 0..=16, gap 0..=32,
# host_gap 0..=48. The superset and orca layouts copy another app's rows,
# so row_padding does not reach them: superset spaces its rows by gap, and
# orca keeps its own gap and padding. Both take indent and host_gap.
# indent = 14
# row_padding = 2
# gap = 6
# host_gap = 10
# What selecting a workspace marks besides its own row: "row" (only the row),
# "group" (a stronger wash over the whole host group), or "group-dim" (that,
# and the other hosts' rows dimmed). Hosts without a colour below use the
# theme's active colour for the wash.
# select = "row"

# A colour per host, keyed by the host's name in the sidebar, as #rgb or
# #rrggbb. It washes the host's header, its workspace rows, and its agents'
# rows faintly, so a long list reads by colour. Names with spaces go in quotes.
# [sidebar.hosts]
# Personal = "#3a4a6b"
# "Mac mini" = "#5a3a3a"

[tabs]
# Default: "Menlo" on macOS, "Cascadia Mono" on Windows (Consolas when
# missing), "DejaVu Sans Mono" on Linux (or an installed monospace family such
# as JetBrains Mono when DejaVu is missing).
# family = "DejaVu Sans Mono"
size = 12
# fallback = ["Symbols Nerd Font Mono"]

[terminal]
# Default: "Menlo" on macOS, "Cascadia Mono" on Windows (Consolas when
# missing), "DejaVu Sans Mono" on Linux (or an installed monospace family such
# as JetBrains Mono when DejaVu is missing).
# family = "DejaVu Sans Mono"
size = 14
# fallback = ["Symbols Nerd Font Mono"]
# Row height as a multiple of size, 1 to 2. Default 20/14 (about 1.43), which
# is 20 logical pixels at size 14. Lower it for tighter rows. Only [terminal]
# takes this key.
# line_height = 1.3

[ui]
# Default: ".SystemUIFont" on macOS and Windows, "DejaVu Sans" on Linux (or an installed
# sans family such as Noto Sans when DejaVu is missing).
# family = "DejaVu Sans"
size = 12
# fallback = ["Symbols Nerd Font Mono"]

# Native GitHub sign-in uses the public Herdr GPUI GitHub App by default.
# Optionally override with your own Device Flow-enabled app's public client ID.
# Never put an App ID, client secret, private key, or token here.
# HERDR_GITHUB_OAUTH_CLIENT_ID overrides this field when set.
# [github]
# oauth_client_id = "YOUR_REGISTERED_PUBLIC_CLIENT_ID"
# Explicit opt-in when an OS credential store is not available, which on macOS
# means every unsigned development build; signed release builds use the Keychain
# and ignore this field. macOS development builds always use the file store.
# Linux uses the desktop keyring (Secret Service) unless this is true, for
# desktops without GNOME Keyring, KWallet, or KeePassXC.
# WARNING: saves an UNENCRYPTED token in the separate 0600 github-credentials file.
# Other software running as you and backups can read it. Default is false.
# allow_plaintext_credentials = false

# A Coder deployment whose workspaces can be created and added as devices from
# the device picker's "Add Coder Workspace…". Settings > Cloud Devices edits
# these keys and saves the client secret to the credential store, so editing
# this table by hand is optional. Register an OAuth2 app in Coder
# (the deployment must enable the `oauth2` experiment) with the redirect URI
# below; Coder compares it as an exact string, so copy it verbatim. Requires the
# `coder` CLI, which carries the connection. Each HERDR_CODER_URL,
# HERDR_CODER_OAUTH_CLIENT_ID, HERDR_CODER_OAUTH_CLIENT_SECRET, and
# HERDR_CODER_OAUTH_REDIRECT_URI variable overrides its field when set.
# [coder]
# url = "https://coder.example.com"
# oauth_client_id = "YOUR_OAUTH2_APP_ID"
# Coder requires a confidential client. Prefer Settings > Cloud Devices, which
# keeps the secret out of this file; when set here or in the environment, this
# value takes precedence. It identifies this app to Coder, not your account.
# oauth_client_secret = "YOUR_OAUTH2_APP_SECRET"
# A loopback address with an explicit port the GUI can listen on while signing in.
# oauth_redirect_uri = "http://127.0.0.1:47823/callback"
# Create workspaces in this organization instead of your default one.
# organization = "default"
# New workspace names start with this prefix (lowercase, digits, hyphens).
# workspace_prefix = "herdr"
# Absolute path to the coder CLI when it is not on PATH or in a usual location.
# cli = "/opt/homebrew/bin/coder"
# Same meaning as [github] allow_plaintext_credentials, for the Coder sign-in,
# which is saved in its own 0600 coder-credentials file. Default is false.
# allow_plaintext_credentials = false

# Daytona sandboxes as devices (experimental). Settings > Cloud Devices >
# Daytona edits this table and saves the API key to the credential store; the
# key is never read from this file. HERDR_DAYTONA_API_KEY overrides the saved
# key and HERDR_DAYTONA_API_URL overrides api_url.
# [daytona]
# api_url = "https://app.daytona.io/api"
# Send requests on behalf of this organization instead of the key's default.
# organization_id = "YOUR_ORGANIZATION_ID"
# The region and snapshot new sandboxes use; Daytona's defaults when unset.
# target = "us"
# snapshot = "daytonaio/sandbox:0.4.3"
# Same meaning as [github] allow_plaintext_credentials, for the API key, which
# is saved in its own 0600 daytona-api-key file. Default is false.
# allow_plaintext_credentials = false

# What the status bar shows, also under Settings > Status bar. Whether usage
# and CPU/memory show at all is [usage] show and show_system_load.
# [status_bar]
# The bar itself. false opens windows without it; Terminal > Toggle Status Bar,
# or a `toggle_status_bar` binding, hides or shows it for the session. While
# hidden, its connection message, prefix and resize badges show nowhere else.
# show = true
# "detailed" draws a meter and a service's two tightest windows; "compact"
# shows each service's tightest limit as one share.
# usage = "detailed"
# "detailed" draws a CPU graph and a memory meter; "compact" shows the shares.
# system_load = "detailed"
# The cup that keeps the display awake; it stays while holding, so it can stop.
# keep_awake = true
# Buttons: "label" for icon and name, "icon" for the icon alone, or "hidden".
# theme = "label"
# shortcuts = "label"
# report_issue = "label"

# Optional behaviors, all off unless turned on here.
# [features]
# Open a space's menu when the pointer rests on its sidebar row, without a
# right click. Moving the pointer anywhere but into that menu closes it again.
# sidebar_hover_menu = false

# Plan usage of AI services in the status bar, for the selected host. A
# service shows when its sign-in is found: an agent's own login on that host
# (read over SSH for a remote host, and never copied off it), or a key or
# cookie set below on this machine.
# [usage]
# Also under Settings > Status bar.
# show = true
# Daemon toolbar segments, including plugin usage percentages; independent of show.
# topbar = true
# Honor the daemon's [ui.sidebar] rows and plugin tokens; false uses native layouts.
# inline = true
# Show these even when no sign-in was found, with what to set up.
# show_providers = ["cursor", "openrouter"]
# Never show these, even when signed in.
# hide_providers = []
# Let providers listed in show_providers read their web session from Chrome
# (and Brave, Edge, Arc, Chromium) or Safari when no cookie is set below.
# Chrome makes macOS ask for Keychain access, so nothing is read until you
# press Allow in that provider's usage panel; Safari needs Full Disk Access.
# browser_cookies = true

# --- usage providers: generated from each provider's settings ---
#
# Found from the agent's own sign-in on the host, with nothing to set:
#   codex, claude, kiro, doubao, pi
#
# OpenAI (openai)
# [usage.providers.openai]
#   An organization Admin API key (sk-admin-...), created by an organization
#   owner at https://platform.openai.com/settings/organization/admin-keys.
#   Project and service-account keys cannot read organization usage.
# api_key = ""  # or OPENAI_ADMIN_KEY, OPENAI_API_KEY
#   Optional. A project ID (proj_...) from
#   https://platform.openai.com/settings/organization/projects to limit spend
#   and usage to that project.
# project_id = ""  # or OPENAI_PROJECT_ID
#   Optional. How many days of spend to total, 1 to 365. Defaults to 30.
# history_days = ""  # or OPENAI_HISTORY_DAYS
#   Optional. Set to 1 to show the legacy prepaid credit balance when the key
#   cannot read organization usage (older user API keys). Ignored with
#   project_id.
# balance_fallback = ""  # or OPENAI_ALLOW_BALANCE_FALLBACK
#
# Azure OpenAI (azureopenai)
# [usage.providers.azureopenai]
#   An Azure OpenAI resource key: in the Azure portal open the Azure OpenAI
#   resource, then Resource Management > Keys and Endpoint, and copy KEY 1.
# api_key = ""  # or AZURE_OPENAI_API_KEY
#   The resource endpoint from the same Keys and Endpoint page, e.g.
#   https://my-resource.openai.azure.com. Only HTTPS is accepted.
# endpoint = ""  # or AZURE_OPENAI_ENDPOINT
#   The deployment name to check, as listed under Deployments in Azure AI
#   Foundry (https://ai.azure.com), e.g. chat-prod.
# deployment = ""  # or AZURE_OPENAI_DEPLOYMENT_NAME
#   Optional. "v1" for the OpenAI-compatible v1 API, or a dated API version.
#   Defaults to 2024-10-21.
# api_version = ""  # or AZURE_OPENAI_API_VERSION
#
# ClinePass (clinepass)
# [usage.providers.clinepass]
#   A Cline API key for the account with the ClinePass subscription. Create one
#   at https://app.cline.bot under Settings > API Keys.
# api_key = ""  # or CLINE_API_KEY, CLINEPASS_API_KEY
#
# Cursor (cursor)
# [usage.providers.cursor]
#   Your cursor.com session. Sign in at https://cursor.com/dashboard, open
#   Developer Tools > Application > Cookies > https://cursor.com, and copy the
#   WorkosCursorSessionToken cookie (or __Secure-next-auth.session-token on
#   older accounts). Paste it as "WorkosCursorSessionToken=value". Not needed
#   when Cursor is listed in show_providers and you are signed in with Chrome or
#   Safari.
# cookie = ""
#
# OpenCode (opencode)
# [usage.providers.opencode]
#   Your opencode.ai session. Sign in at https://opencode.ai/auth, open
#   Developer Tools > Application > Cookies > https://opencode.ai, and copy the
#   auth and __Host-console_session cookies (either one alone also works). Paste
#   them as "auth=value; __Host-console_session=value".
# cookie = ""
#   Optional. The workspace to read, as a wrk_... ID or the
#   https://opencode.ai/workspace/... URL of its dashboard. Defaults to the
#   first workspace of the account.
# workspace_id = ""  # or CODEXBAR_OPENCODE_WORKSPACE_ID
#
# OpenCode Go (opencodego)
# [usage.providers.opencodego]
#   An OpenCode API key for the account with the Go subscription, created at
#   https://opencode.ai/auth under API Keys. Preferred over the cookie. When
#   unset, the key `opencode auth login` saved in
#   ~/.local/share/opencode/auth.json is used.
# api_key = ""  # or OPENCODE_API_KEY
#   Your opencode.ai session, used when no API key is set. Sign in at
#   https://opencode.ai/auth, open Developer Tools > Application > Cookies >
#   https://opencode.ai, and copy the __Host-console_session and auth cookies
#   (either one alone also works). Paste them as "__Host-console_session=value;
#   auth=value".
# cookie = ""
#   Optional, for the cookie sign-in. The workspace to read, as a wrk_... or
#   org_... ID or its https://opencode.ai/console/... URL. Defaults to the first
#   workspace of the account.
# workspace_id = ""  # or CODEXBAR_OPENCODE_WORKSPACE_ID
#
# Alibaba (alibaba)
# [usage.providers.alibaba]
#   Your Model Studio console session. Sign in to the Coding Plan page at
#   https://modelstudio.console.alibabacloud.com (or
#   https://bailian.console.aliyun.com in China), open Developer Tools >
#   Application > Cookies for that site, and copy at least
#   login_aliyunid_ticket, login_aliyunid_pk, login_aliyunid_csrf and cna. Paste
#   them as "name=value; name2=value2", or copy the whole Cookie header of the
#   data/api.json request from the Network tab.
# cookie = ""  # or ALIBABA_CODING_PLAN_COOKIE
#   A Coding Plan API key (sk-sp-...) from the Coding Plan page of the Model
#   Studio console. Used when no console cookie works; some mainland accounts
#   only answer the cookie.
# api_key = ""  # or ALIBABA_CODING_PLAN_API_KEY, ALIBABA_QWEN_API_KEY, DASHSCOPE_API_KEY
#   Optional. "intl" (modelstudio.console.alibabacloud.com) or "cn"
#   (bailian.console.aliyun.com). Unset tries International, then China
#   mainland.
# region = ""
#   Optional. The console's sec_token, when it cannot be read from
#   /tool/user/info.json: in Developer Tools > Network, the sec_token form field
#   of the data/api.json request on the Coding Plan page.
# sec_token = ""
#
# Alibaba Token Plan (alibabatokenplan)
# [usage.providers.alibabatokenplan]
#   Which Token Plan to read: "intl" (International Team, the default), "cn"
#   (China mainland Team), "intl-personal" or "cn-personal" (Personal/Solo).
# region = ""
#   Only needed without a signed-in Bailian CLI (bl). Sign in to the Token Plan
#   page (https://modelstudio.console.alibabacloud.com, or
#   https://bailian.console.aliyun.com in China), open Developer Tools >
#   Application > Cookies for that site, and copy at least
#   login_aliyunid_ticket, login_aliyunid_pk, login_aliyunid_csrf and cna. Paste
#   them as "name=value; name2=value2", or copy the whole Cookie header of the
#   data/api.json request from the Network tab.
# cookie = ""  # or ALIBABA_TOKEN_PLAN_COOKIE
#   Optional. The console's sec_token, when it cannot be read from
#   /tool/user/info.json: in Developer Tools > Network, the sec_token form field
#   of any data/api.json request on the Token Plan page.
# sec_token = ""
#
# Qwen Cloud (qwencloud)
# [usage.providers.qwencloud]
#   Your Qwen Cloud console session. Sign in at
#   https://home.qwencloud.com/billing/subscription/token-plan-individual, open
#   Developer Tools > Application > Cookies > https://home.qwencloud.com, and
#   copy the login ticket (login_qwencloud_ticket or login_aliyunid_ticket)
#   together with login_aliyunid_csrf and cna. Paste them as "name=value;
#   name2=value2", or copy the whole Cookie header of the data/api.json request
#   from the Network tab.
# cookie = ""  # or QWEN_CLOUD_COOKIE
#   Optional. The console's sec_token, when it cannot be read from
#   /tool/user/info.json: in Developer Tools > Network, the sec_token form field
#   of the data/api.json request on the Token Plan page.
# sec_token = ""
#
# Droid (factory)
# [usage.providers.factory]
#   A Factory API key (fk-…) from https://app.factory.ai/settings/api-keys.
# api_key = ""  # or FACTORY_API_KEY
#   Used when no API key is set. Sign in to https://app.factory.ai, open
#   Developer Tools > Application > Cookies > https://app.factory.ai, and copy
#   the session cookies (wos-session, access-token, and any *.session-token) as
#   "name=value; name2=value2".
# cookie = ""
#
# Fireworks (fireworks)
# [usage.providers.fireworks]
#   A Fireworks API key from https://app.fireworks.ai/settings/users/api-keys.
#   It reads the account's billing summary.
# api_key = ""  # or FIREWORKS_API_KEY, FIREWORKS_KEY
#   The Fireworks account id, needed only when the API key can see several
#   accounts. Find it in the account switcher on https://app.fireworks.ai or
#   with `firectl whoami`.
# account_slug = ""  # or FIREWORKS_ACCOUNT_SLUG
#
# Gemini (gemini)
# [usage.providers.gemini]
#   The Gemini CLI's OAuth client id, used to refresh an expired sign-in.
#   Normally found in the installed CLI (OAUTH_CLIENT_ID in
#   @google/gemini-cli-core/dist/src/code_assist/oauth2.js); set it only when
#   the CLI is not on the host's PATH.
# client_id = ""  # or GEMINI_OAUTH_CLIENT_ID
