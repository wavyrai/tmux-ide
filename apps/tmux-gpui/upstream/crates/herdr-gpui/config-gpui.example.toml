#   The dashboard session. Sign in to https://cloud.helmcode.com/dashboard (or
#   https://cloud.nan.builders/dashboard for NaN Builders), open Developer Tools
#   > Network, reload, and copy the Cookie request header of a request to
#   cloud-api.helmcode.com (or cloud-api.nan.builders). Developer Tools >
#   Application > Cookies lists the same cookies. Paste it as "name=value;
#   name2=value2".
# cookie = ""
#   Which dashboard a pasted cookie belongs to: "helmcode" (default) or
#   "nanBuilders".
# tenant = ""
#
# ClawRouter (clawrouter)
# [usage.providers.clawrouter]
#   A ClawRouter policy API key, created at
#   https://clawrouter.openclaw.ai/dashboard/access.
# api_key = ""  # or CLAWROUTER_API_KEY
#   Optional HTTPS service root or /v1 URL of another ClawRouter deployment.
#   Defaults to https://clawrouter.openclaw.ai.
# base_url = ""  # or CLAWROUTER_BASE_URL
#
# LongCat (longcat)
# [usage.providers.longcat]
#   The LongCat console session. Sign in at https://longcat.chat/platform/usage,
#   open Developer Tools > Application > Cookies > https://longcat.chat, and
#   copy every cookie of the site (the console does not document which one holds
#   the session). Paste them as "name=value; name2=value2", or copy the Cookie
#   request header of a request to longcat.chat from the Network tab.
# cookie = ""  # or LONGCAT_MANUAL_COOKIE
#
# sub2api (sub2api)
# [usage.providers.sub2api]
#   A sub2api group API key (sk-…), created in your sub2api deployment's
#   dashboard under API keys. Usage is scoped to that key's group.
# api_key = ""  # or SUB2API_API_KEY
#   Your sub2api deployment, e.g. https://sub2api.example.com. HTTPS is
#   required, except plain HTTP on a loopback address such as
#   http://127.0.0.1:8080.
# base_url = ""  # or SUB2API_BASE_URL
#
# Wayfinder (wayfinder)
# [usage.providers.wayfinder]
#   The Wayfinder gateway, started with `wayfinder-router serve`. Defaults to
#   http://127.0.0.1:8088; another URL must be HTTPS, or plain HTTP on a
#   loopback address.
# base_url = ""  # or WAYFINDER_GATEWAY_URL
#
# ZenMux (zenmux)
# [usage.providers.zenmux]
#   A Management API key created at https://zenmux.ai/platform/management.
#   Normal inference API keys are rejected by the usage endpoints.
# api_key = ""  # or ZENMUX_MANAGEMENT_API_KEY
#
# ai& (aiand)
# [usage.providers.aiand]
#   An ai& API key (starts with sk-), created at https://console.aiand.com under
#   Settings > API Keys > Create. Keys are shown only once.
# api_key = ""  # or AIAND_API_KEY
#
# ZoomMate (zoommate)
# [usage.providers.zoommate]
#   Your Zoom session cookies. Sign in at https://zoommate.zoom.us, open
#   Developer Tools > Application > Cookies for https://zoommate.zoom.us (Zoom's
#   sign-in cookies such as _zm_ssid, _zm_lang and cf_clearance live on
#   zoom.us), and paste them all as "name=value; name2=value2". They are
#   exchanged for a short-lived token on every refresh.
# cookie = ""
#   A bearer token instead of cookies: on https://zoommate.zoom.us open
#   Developer Tools > Network, reload the AI credit usage page, select the
#   credits/status request and copy its Authorization header without "Bearer ".
#   It expires after about an hour.
# token = ""
#
# xAI (xai)
# [usage.providers.xai]
#   A Management API key from https://console.x.ai under Settings > Management
#   Keys, with billing read access. Inference API keys are not accepted.
# api_key = ""  # or XAI_MANAGEMENT_API_KEY
#   The xAI team ID to bill against, shown in the xAI Console URL and team
#   settings. The Management key must belong to this team.
# team_id = ""  # or XAI_TEAM_ID
#
# Notion AI (notion)
# [usage.providers.notion]
#   Your Notion session cookie. Sign in at https://app.notion.com, open
#   Developer Tools > Application > Cookies for https://app.notion.com (or
#   notion.so), copy the token_v2 cookie and paste it as "token_v2=value" (add
#   "; notion_user_id=value" for accounts signed in to several users).
# cookie = ""
#   The workspace (space) ID to read, dashed or not, for accounts in several
#   workspaces. Defaults to the first Business or Enterprise workspace. It is
#   the x-notion-space-id header of requests in Developer Tools > Network.
# workspace_id = ""
#
# IBM Bob (ibmbob)
# [usage.providers.ibmbob]
#   An IBM Bob API key that can read subscription usage, created at
#   https://bob.ibm.com (the same key Bob Shell uses as BOBSHELL_API_KEY).
# api_key = ""  # or BOBSHELL_API_KEY
#   Instead of an API key, an IBM Cloud bearer token (a JWT) for your Bob
#   account. It is sent as "Authorization: Bearer <token>".
# token = ""
#
# Nous Portal (nous)
# [usage.providers.nous]
#   A Nous Portal OAuth access token, used instead of Hermes Agent's login in
#   ~/.hermes/auth.json (sign in with `hermes auth add nous`). It lasts about an
#   hour; portal API keys are not accepted.
# token = ""  # or NOUS_PORTAL_ACCESS_TOKEN
#   An HTTPS portal origin such as https://portal.nousresearch.com, for a
#   preview deployment. Plain HTTP is refused.
# base_url = ""  # or NOUS_PORTAL_BASE_URL, HERMES_PORTAL_BASE_URL
#
# Muse Code (muse)
# [usage.providers.muse]
#   A Muse CLI device-code access token (it starts with dca:), used when this
#   host has no `muse login`. It is providers.meta.access_token in
#   ~/.config/muse/auth.json on a machine where you ran `muse login`. Dashboard
#   LLM_ keys and LLM| inference keys are not accepted.
# token = ""
#
# CodeRabbit (coderabbit)
# [usage.providers.coderabbit]
#   The path of the coderabbit executable on the probed host, when it is not on
#   the usual PATH (~/.local/bin, Homebrew). Sign in once with `coderabbit auth
#   login`.
# cli_path = ""  # or CODERABBIT_CLI_PATH
#
# Replicate (replicate)
# [usage.providers.replicate]
#   Sign in at https://replicate.com/account/billing, open Developer Tools >
#   Application > Cookies > https://replicate.com, and copy sessionid (and
#   csrftoken when present) as one "sessionid=value; csrftoken=value" header. An
#   API token does not work here.
# cookie = ""
#
# Hugging Face (huggingface)
# [usage.providers.huggingface]
#   A Hugging Face access token from https://huggingface.co/settings/tokens. A
#   classic read token works; a fine-grained token needs the Billing read
#   permission. Not needed when `hf auth login` has saved a token on the host.
# api_key = ""  # or CODEXBAR_HUGGINGFACE_API_KEY, HF_TOKEN, HUGGING_FACE_HUB_TOKEN
#   Optional, for the prepaid credit balance. Sign in at
#   https://huggingface.co/settings/billing with the token's account, open
#   Developer Tools > Application > Cookies > https://huggingface.co, and copy
#   the token cookie as "token=value" (or every cookie there as "name=value;
#   name2=value2").
# cookie = ""
#
# Raycast (raycast)
# [usage.providers.raycast]
#   Sign in at https://www.raycast.com/settings, open Developer Tools >
#   Application > Cookies > https://www.raycast.com, and copy __raycast_session
#   (and csrf_token when present) as one "__raycast_session=value;
#   csrf_token=value" header.
# cookie = ""
#
# v0 (v0)
# [usage.providers.v0]
#   A v0 Platform API key from https://v0.app/settings/keys.
# api_key = ""  # or V0_API_KEY
#   Optional project ID or slug to read that scope's billing and rate limit.
# scope = ""  # or V0_SCOPE
#
# TypeSafe (typesafe)
# [usage.providers.typesafe]
#   Sign in at https://console.typesafe.ai/settings/billing, open Developer
#   Tools > Application > Cookies > https://console.typesafe.ai, and copy every
#   cookie there as one "name=value; name2=value2" header. An inference API key
#   does not work here.
# cookie = ""
#
# Charm Hyper (hyper)
# [usage.providers.hyper]
#   A Charm Hyper API key from https://hyper.charm.land. Used when no browser
#   session is available or the session has expired.
# api_key = ""  # or HYPER_API_KEY
#   Sign in at https://hyper.charm.land, open Developer Tools > Application >
#   Cookies > https://hyper.charm.land, and copy every cookie there as one
#   "name=value; name2=value2" header.
# cookie = ""
#
# GitKraken AI (gitkraken)
# [usage.providers.gitkraken]
#   A GitKraken account session access token. Sign in at
#   https://gitkraken.dev/account#ai-usage, open Developer Tools > Network,
#   select the successful ai-tasks/usage request, and copy only the value after
#   "Bearer " in its Authorization header. Replace it when it expires.
# token = ""  # or GITKRAKEN_API_TOKEN
#   Optional organization ID: the gk-org-id header of the same request, to read
#   that organization's shared pool.
# org_id = ""  # or GITKRAKEN_ORG_ID
#
# DevPass (devpass)
# [usage.providers.devpass]
#   A regular LLM Gateway API key from https://devpass.llmgateway.io/dashboard.
#   Publishable keys cannot read plan usage.
# api_key = ""  # or DEVPASS_API_KEY
#
# Atlas Cloud (atlascloud)
# [usage.providers.atlascloud]
#   A standard Atlas Cloud API key from https://www.atlascloud.ai/console. It
#   needs account balance read permission: use the account owner's key, or an
#   Account Admin or Finance key for a team. A public key ID (ak_…) cannot
#   authenticate.
# api_key = ""  # or ATLASCLOUD_API_KEY
#
# Vercel AI Gateway (vercel)
# [usage.providers.vercel]
#   An AI Gateway API key from the Vercel dashboard: AI Gateway > API Keys. The
#   balance is the key's team, so use a key of the team to show.
# api_key = ""  # or AI_GATEWAY_API_KEY
#
# llmman (llmman)
# [usage.providers.llmman]
#   The llmman serve address, when not http://127.0.0.1:17434. A host without a
#   scheme uses HTTP on port 17434, e.g. localhost:18000. Plain HTTP is allowed
#   only for loopback, private-network, and .local hosts; others need HTTPS.
#   Without it, LLMMAN_HOST on the probed host is used when set.
# base_url = ""
#   Only when the daemon was started with LLMMAN_API_KEYS: one of those keys.
# api_key = ""  # or LLMMAN_API_KEY
#
# xKiro (xkiro)
# [usage.providers.xkiro]
#   An xKiro API key from your account at https://xkiro.com. It is sent only to
#   api.xkiro.com; reading usage spends no tokens.
# api_key = ""  # or XKIRO_API_KEY
# --- end usage providers ---
