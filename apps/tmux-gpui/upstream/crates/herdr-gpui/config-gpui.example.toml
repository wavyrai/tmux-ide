#   in at https://www.kimi.com/code/console, open Developer Tools →
#   Application → Cookies → https://www.kimi.com, and copy the value of the
#   `kimi-auth` cookie (a JWT starting with eyJ), without its name. On kimi.ai,
#   copy `access_token` from Local Storage instead. Not needed when Kimi is
#   listed in show_providers and you are signed in with Chrome or Safari.
# token = ""  # or KIMI_AUTH_TOKEN
#   Instead of token, a whole Kimi Cookie header that includes kimi-auth, as
#   "kimi-auth=value; …".
# cookie = ""  # or KIMI_MANUAL_COOKIE
#
# Kilo (kilo)
# [usage.providers.kilo]
#   A Kilo API key from https://app.kilo.ai (Profile → API keys). Without one,
#   the Kilo CLI's sign-in in ~/.local/share/kilo/auth.json is used; run `kilo
