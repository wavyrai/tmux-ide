# cargo-deny configuration. Run locally with `cargo deny check`.
#
# Evaluate every shipped target: both macOS architectures, experimental
# x86_64/ARM64 GNU/Linux, and experimental x86_64/ARM64 Windows. This set is pinned to
# the release targets by scripts/release/test-release-security.py.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Security vulnerabilities always fail. "Unmaintained" is scoped to crates this
# workspace depends on directly: GPUI's own tree carries several discontinued
# crates (async-std, rustybuzz, ttf-parser, paste) that we cannot act on
# without changing the pinned GPUI version.
unmaintained = "workspace"
ignore = [
    # bincode 2 is unmaintained but is the wire format the Herdr daemon speaks.
    # Field and variant order is part of protocol compatibility, so this is not
    # a swappable dependency. Revisit if an actual vulnerability is filed.
    { id = "RUSTSEC-2025-0141", reason = "bincode 2 is the daemon wire format; unmaintained, not vulnerable" },
]

# GHSA-38c5-483c-4qqp / CVE-2026-42199: integer overflow in grid's
# `Grid::expand_rows` can desynchronise logical dimensions from the backing
# `Vec`, after which the safe `get()` reaches `get_unchecked()` with an invalid
# index. Affects grid >= 0.17.0, <= 1.0.0; fixed in 1.0.1.
#
# Not ignored here, because RustSec has not filed it and `cargo deny check
# advisories` does not flag it. Recorded so the GitHub Dependabot alert has a
# tracked rationale in-tree.
#
# No upgrade path exists from this workspace:
#   herdr-gpui -> gpui =0.2.2 -> taffy =0.9.0 -> grid ^0.18.0
# gpui 0.2.2 is the newest release and pins taffy to an exact version; taffy
# only moved to grid ^1.0.0 in 0.9.2. `cargo update -p grid --precise 1.0.1`
# therefore fails, and `[patch.crates-io]` cannot help because no taffy source
# revision carries both version 0.9.0 and the grid 1.0 requirement.
#
# The vulnerable code is also unreachable. taffy 0.9.0 uses the grid crate from
# exactly one module, `src/compute/grid/types/cell_occupancy.rs`, and calls only
# `Grid::new`, `Grid::from_vec`, `get`, `get_mut`, `iter_row`, `iter_col`,
# `rows`, and `cols`. It never calls `expand_rows` or any other resizing API, so
# the overflowing length computation is never executed.
#
# Revisit when gpui ships a release that depends on taffy >= 0.9.2.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's CA root certificate set, via webpki-roots <- ureq. CDLA-Permissive
    # is a data licence covering the certificate list rather than code; it imposes
    # no obligation on a binary that embeds it.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# libbz2-rs-sys, a pure-Rust bzip2 port reached through gpui-pre's HTTP client
# (async-compression). Its bzip2-1.0.6 licence is BSD-style and permissive; the
# exception stays scoped to this crate rather than allowing the licence broadly.
exceptions = [{ allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace pins GPUI to an exact version on purpose.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
