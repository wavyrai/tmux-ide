[workspace]
members  = ["crates/herdr-client", "crates/tmux-ide-gpui", "crates/herdr-protocol", "crates/tmux-native-surface-sdk"]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.96"
# Cargo metadata only. Releases carry a derived calendar version YYYYMMDD.COUNTER
# that CI embeds as HERDR_RELEASE_VERSION; this value never reaches the UI.
version = "0.1.0"
# Workspace crates are not published to crates.io; they build this application.
publish = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
url = "2"
anyhow               = "1"
base64               = "0.23.1"
bincode              = { default-features = false, features = ["serde", "std"], version = "2" }
chrono               = { default-features = false, features = ["clock"], version = "0.4" }
crossbeam-channel    = "0.5"
flate2               = "1"
# Locates installed font files on Linux, as GPUI's own text system does.
fontdb               = "0.23"
gpui                 = { package = "bezel-gpui", version = "=0.3.19" }
gpui_apple           = { package = "bezel-gpui-apple", version = "=0.3.19" }
objc2-core-video     = { default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"], version = "=0.3.2" }
gpui_platform        = { package = "bezel-gpui-platform", version = "=0.3.19" }
bezel_theme          = { package = "bezel-theme", version = "=0.2.16" }
bezel_ui             = { package = "bezel-ui", version = "=0.2.16" }
herdr-client         = { path = "crates/herdr-client" }
tmux-native-surface-sdk = { path = "crates/tmux-native-surface-sdk" }
herdr-protocol       = { path = "crates/herdr-protocol" }
interprocess         = "2.4.2"
image                = { default-features = false, features = ["gif", "jpeg", "png", "webp"], version = "0.25.10" }
# Helix's fzf-style scorer behind the command palette.
nucleo-matcher       = "0.3.1"
objc2                = "0.6.4"
objc2-app-kit        = { default-features = false, features = ["NSApplication", "NSDockTile", "NSEvent", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSTextInputContext", "NSView", "std"], version = "0.3.2" }
objc2-foundation     = { default-features = false, features = ["NSBundle", "NSData", "NSError", "NSProcessInfo", "NSString", "std"], version = "0.3.2" }
# Objective-C blocks and Core Foundation types for the native surfaces.
block2               = "0.6.2"
objc2-core-foundation = { default-features = false, features = ["CFCGTypes", "std"], version = "0.3.2" }
raw-window-handle    = "0.6"
rustix               = { features = ["event", "fs", "process"], version = "=1.1.5" }
serde                = { features = ["derive"], version = "1" }
serde_json           = "1"
sha2                 = "0.11.0"
# Reads embedded bitmap strikes to spot fonts GPUI's Linux rasterizer panics on.
skrifa               = { default-features = false, features = ["std"], version = "0.44" }
tempfile             = "3"
thiserror            = "2"
toml                 = "1.1"
tracing              = "0.1"
unicode-width        = "0.2.2"
tungstenite          = { version = "0.28", default-features = false, features = ["handshake"] }
ureq                 = "3"
uuid                 = { features = ["serde"], version = "1" }
windows-sys          = { features = ["Win32_Foundation", "Win32_System_Pipes"], version = "0.61.2" }

# Repository-owned Apple surface support; pinned source and modifications live in ../vendor.
[patch.crates-io]
bezel-gpui-apple = { path = "../vendor/bezel-gpui-apple" }
