name: Documentation Issue
description: Report missing, incorrect, or unclear Herdr GPUI documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Missing documentation
        - Incorrect or outdated information
        - Unclear explanation
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Documentation URL or file
      placeholder: "README.md, crates/herdr-gpui/README.md, or a URL"
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Redact any secrets or private information in examples.
