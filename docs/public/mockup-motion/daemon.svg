<svg xmlns="http://www.w3.org/2000/svg" width="504" height="255" viewBox="0 0 504 254.8" role="img" aria-label="An animated cursor performance">
<style>.mt-cursor{transform:translate(256.2px,81.9px)}
.mt-rip{fill:none;stroke:#087c9f;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
.mt-cursor{animation:mt-travel 4000ms linear infinite both}
.mt-rip{animation:mt-ripple 4000ms linear infinite both}
}
@keyframes mt-travel{0%{transform:translate(478px,236.8px)}5%{transform:translate(478.2px,237px)}6.0417%{transform:translate(475.52px,234.58px)}7.0833%{transform:translate(462.06px,220.63px)}8.125%{transform:translate(433.11px,194.07px)}9.1667%{transform:translate(391.19px,160.48px)}10.2083%{transform:translate(343.5px,127.63px)}11.25%{transform:translate(300.92px,102.43px)}12.2917%{transform:translate(271.02px,87.96px)}13.3333%{transform:translate(251.71px,80.39px)}14.375%{transform:translate(247.71px,78.6px)}15.4167%{transform:translate(249.26px,79.01px)}16.4583%{transform:translate(254.69px,81.1px)}17.5%{transform:translate(256.2px,81.9px)}21.6667%{transform:translate(256.2px,81.9px)}22.5%{transform:translate(255.91px,83.01px)}37.0833%{transform:translate(255.66px,82.65px)}49.5833%{transform:translate(255.46px,82.29px)}62.0833%{transform:translate(255.3px,81.9px)}75.625%{transform:translate(255.24px,81.49px)}81.875%{transform:translate(255.25px,81.32px)}82.5%{transform:translate(256.2px,81.9px)}100%{transform:translate(256.2px,81.9px)}}
@keyframes mt-ripple{
0%{opacity:.55;transform:scale(.12)}
15.5%{opacity:0;transform:scale(1)}
100%{opacity:0;transform:scale(1)}
}</style>

<g></g>
<g class="mt-cursor">
<g transform="translate(-5,-2.5)">
<path d="M5 2.5 L5 19.4 L9.2 15.3 L11.9 21.2 L14.6 20 L11.9 14.2 L17.6 14.2 Z" fill="#fff" stroke="rgba(17,17,20,0.92)" stroke-width="1.35" stroke-linejoin="round"/>
</g>
</g>
</svg>