<svg xmlns="http://www.w3.org/2000/svg" width="504" height="255" viewBox="0 0 504 254.8" role="img" aria-label="An animated cursor performance">
<style>.mt-cursor{transform:translate(256.2px,209.3px)}
.mt-rip{fill:none;stroke:#087c9f;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
.mt-cursor{animation:mt-travel 4000ms linear infinite both}
.mt-rip{animation:mt-ripple 4000ms linear infinite both}
}
@keyframes mt-travel{0%{transform:translate(478px,236.8px)}5%{transform:translate(477.75px,236.51px)}6.0417%{transform:translate(475.66px,235.8px)}7.0833%{transform:translate(460.32px,230.13px)}8.125%{transform:translate(429.65px,220.4px)}9.1667%{transform:translate(385.01px,211.37px)}10.2083%{transform:translate(337.96px,205.91px)}11.25%{transform:translate(297.36px,205.02px)}12.2917%{transform:translate(271.68px,207.29px)}13.3333%{transform:translate(255.15px,209.69px)}14.375%{transform:translate(248.83px,210.63px)}15.4167%{transform:translate(249px,210.78px)}16.4583%{transform:translate(253.29px,209.97px)}17.5%{transform:translate(255.97px,209.27px)}27.2917%{transform:translate(256.29px,209.02px)}40.8333%{transform:translate(256.14px,208.62px)}57.5%{transform:translate(256.05px,208.22px)}82.5%{transform:translate(256.18px,207.91px)}82.5%{transform:translate(256.2px,209.3px)}100%{transform:translate(256.2px,209.3px)}}
@keyframes mt-ripple{
0%{opacity:.55;transform:scale(.12)}
15.5%{opacity:0;transform:scale(1)}
100%{opacity:0;transform:scale(1)}
}</style>

<g><circle class="mt-rip" cx="256.2" cy="209.3" r="20" style="animation-delay:788.8ms"/></g>
