<svg xmlns="http://www.w3.org/2000/svg" width="504" height="255" viewBox="0 0 504 254.8" role="img" aria-label="An animated cursor performance">
<style>.mt-cursor{transform:translate(172.2px,81.9px)}
.mt-rip{fill:none;stroke:#087c9f;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
.mt-cursor{animation:mt-travel 4000ms linear infinite both}
.mt-rip{animation:mt-ripple 4000ms linear infinite both}
}
@keyframes mt-travel{0%{transform:translate(478px,236.8px)}5%{transform:translate(478px,236.78px)}6.0417%{transform:translate(473.51px,236.04px)}7.0833%{transform:translate(448.3px,232.91px)}8.125%{transform:translate(399.49px,222.5px)}9.1667%{transform:translate(336.45px,199.85px)}10.2083%{transform:translate(273.57px,165.82px)}11.25%{transform:translate(222.09px,128.44px)}12.2917%{transform:translate(188.76px,98.31px)}13.3333%{transform:translate(168.05px,77.86px)}14.375%{transform:translate(164.16px,73.23px)}15.4167%{transform:translate(165.74px,75.49px)}16.4583%{transform:translate(170.62px,80.24px)}17.5%{transform:translate(172.2px,81.9px)}21.6667%{transform:translate(172.2px,81.9px)}22.5%{transform:translate(171.94px,82.64px)}35%{transform:translate(171.77px,82.28px)}47.5%{transform:translate(171.61px,81.9px)}61.0417%{transform:translate(171.51px,81.48px)}76.6667%{transform:translate(171.53px,81.07px)}81.875%{transform:translate(171.58px,80.95px)}82.5%{transform:translate(172.2px,81.9px)}100%{transform:translate(172.2px,81.9px)}}
@keyframes mt-ripple{
0%{opacity:.55;transform:scale(.12)}
15.5%{opacity:0;transform:scale(1)}
100%{opacity:0;transform:scale(1)}
}</style>

