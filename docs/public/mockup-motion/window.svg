<svg xmlns="http://www.w3.org/2000/svg" width="504" height="255" viewBox="0 0 504 254.8" role="img" aria-label="An animated cursor performance">
<style>.mt-cursor{transform:translate(491.4px,27.3px)}
.mt-rip{fill:none;stroke:#087c9f;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
.mt-cursor{animation:mt-travel 4000ms linear infinite both}
.mt-rip{animation:mt-ripple 4000ms linear infinite both}
}
@keyframes mt-travel{0%{transform:translate(478px,236.8px)}5%{transform:translate(478.2px,237px)}6.0417%{transform:translate(478.49px,234.6px)}7.0833%{transform:translate(482.08px,220.24px)}8.125%{transform:translate(487.77px,191.35px)}9.1667%{transform:translate(493.54px,151.19px)}10.2083%{transform:translate(496.35px,106.95px)}11.25%{transform:translate(495.82px,68.24px)}12.2917%{transform:translate(493.4px,41.99px)}13.3333%{transform:translate(491.11px,25.2px)}14.375%{transform:translate(490.13px,19.74px)}15.4167%{transform:translate(490.52px,21.17px)}16.4583%{transform:translate(491.03px,25.49px)}17.5%{transform:translate(491.4px,27.3px)}25.4167%{transform:translate(491.4px,27.3px)}26.25%{transform:translate(491.11px,28.41px)}40.8333%{transform:translate(490.86px,28.05px)}53.3333%{transform:translate(490.66px,27.69px)}65.8333%{transform:translate(490.5px,27.3px)}79.375%{transform:translate(490.44px,26.89px)}82.5%{transform:translate(490.44px,26.8px)}82.5%{transform:translate(491.4px,27.3px)}100%{transform:translate(491.4px,27.3px)}}
@keyframes mt-ripple{
0%{opacity:.55;transform:scale(.12)}
15.5%{opacity:0;transform:scale(1)}
100%{opacity:0;transform:scale(1)}
}</style>

<g><circle class="mt-rip" cx="491.4" cy="27.3" r="20" style="animation-delay:777.7ms"/></g>
<g class="mt-cursor">
<g transform="translate(-5,-2.5)">
<path d="M5 2.5 L5 19.4 L9.2 15.3 L11.9 21.2 L14.6 20 L11.9 14.2 L17.6 14.2 Z" fill="#fff" stroke="rgba(17,17,20,0.92)" stroke-width="1.35" stroke-linejoin="round"/>
</g>
</g>
</svg>