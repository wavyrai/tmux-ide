<svg xmlns="http://www.w3.org/2000/svg" width="504" height="255" viewBox="0 0 504 254.8" role="img" aria-label="An animated cursor performance">
<style>.mt-cursor{transform:translate(457.8px,245.7px)}
.mt-rip{fill:none;stroke:#087c9f;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
.mt-cursor{animation:mt-travel 4000ms linear infinite both}
.mt-rip{animation:mt-ripple 4000ms linear infinite both}
}
@keyframes mt-travel{0%{transform:translate(478px,236.8px)}5%{transform:translate(478.07px,236.67px)}6.0417%{transform:translate(476.9px,236.79px)}7.0833%{transform:translate(471.09px,238.52px)}8.125%{transform:translate(463.45px,242.43px)}9.1667%{transform:translate(458.58px,245.31px)}10.2083%{transform:translate(457.22px,245.82px)}11.25%{transform:translate(457.83px,245.66px)}25.4167%{transform:translate(457.8px,245.7px)}26.25%{transform:translate(458px,244.34px)}82.5%{transform:translate(457.78px,244.59px)}82.5%{transform:translate(457.8px,245.7px)}100%{transform:translate(457.8px,245.7px)}}
@keyframes mt-ripple{
0%{opacity:.55;transform:scale(.12)}
15.5%{opacity:0;transform:scale(1)}
100%{opacity:0;transform:scale(1)}
}</style>

<g><circle class="mt-rip" cx="457.8" cy="245.7" r="20" style="animation-delay:542.8ms"/></g>
<g class="mt-cursor">
<g transform="translate(-5,-2.5)">
<path d="M5 2.5 L5 19.4 L9.2 15.3 L11.9 21.2 L14.6 20 L11.9 14.2 L17.6 14.2 Z" fill="#fff" stroke="rgba(17,17,20,0.92)" stroke-width="1.35" stroke-linejoin="round"/>
</g>
</g>
</svg>