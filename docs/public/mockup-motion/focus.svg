<svg xmlns="http://www.w3.org/2000/svg" width="504" height="255" viewBox="0 0 504 254.8" role="img" aria-label="An animated cursor performance">
<style>.mt-cursor{transform:translate(373.8px,118.3px)}
.mt-rip{fill:none;stroke:#087c9f;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
.mt-cursor{animation:mt-travel 4000ms linear infinite both}
.mt-rip{animation:mt-ripple 4000ms linear infinite both}
}
@keyframes mt-travel{0%{transform:translate(478px,236.8px)}5%{transform:translate(477.75px,236.51px)}6.0417%{transform:translate(476.83px,234.42px)}7.0833%{transform:translate(469.44px,221.09px)}8.125%{transform:translate(453.26px,196.61px)}9.1667%{transform:translate(430.04px,167.04px)}10.2083%{transform:translate(405.03px,141.92px)}11.25%{transform:translate(385.81px,126.47px)}12.2917%{transform:translate(374.6px,118.36px)}13.3333%{transform:translate(369.36px,115.4px)}14.375%{transform:translate(369.64px,115.62px)}15.4167%{transform:translate(372.61px,117.55px)}16.4583%{transform:translate(373.81px,118.31px)}31.4583%{transform:translate(373.84px,117.89px)}45%{transform:translate(373.71px,117.51px)}63.75%{transform:translate(373.65px,117.11px)}82.5%{transform:translate(373.78px,116.91px)}82.5%{transform:translate(373.8px,118.3px)}100%{transform:translate(373.8px,118.3px)}}
@keyframes mt-ripple{
0%{opacity:.55;transform:scale(.12)}
15.5%{opacity:0;transform:scale(1)}
100%{opacity:0;transform:scale(1)}
}</style>

<g><circle class="mt-rip" cx="373.8" cy="118.3" r="20" style="animation-delay:731.5ms"/></g>
<g class="mt-cursor">
<g transform="translate(-5,-2.5)">
