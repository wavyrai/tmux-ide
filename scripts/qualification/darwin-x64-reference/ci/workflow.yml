name: Darwin x64 matched grid reference (build only)
on:
  workflow_dispatch:
  push:
    branches: [qualification/darwin-x64-matched-reference]
permissions:
  contents: read
  actions: read
concurrency:
  group: darwin-x64-matched-reference
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: recipe
          persist-credentials: false
      - name: Download exact accepted Intel input artifact
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/reference-download"
          gh api repos/wavyrai/tmux-ide/actions/artifacts/11052542881 > "$RUNNER_TEMP/reference-download/artifact.json"
          gh api repos/wavyrai/tmux-ide/actions/artifacts/11052542881/zip > "$RUNNER_TEMP/reference-download/artifact.zip"
      - name: Admit inputs and build only matched grid reference
        timeout-minutes: 35
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /usr/bin/python3 recipe/scripts/qualification/darwin-x64-reference/ci/prepare.py \
            --metadata "$RUNNER_TEMP/reference-download/artifact.json" \
            --archive "$RUNNER_TEMP/reference-download/artifact.zip" \
            --output "$RUNNER_TEMP/matched-reference"
      - name: Preserve reference and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darwin-x64-matched-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/matched-reference/matched-reference.tar
            ${{ runner.temp }}/matched-reference/*.json
            ${{ runner.temp }}/matched-reference/logs
            ${{ runner.temp }}/matched-reference/reference/*.json
            ${{ runner.temp }}/matched-reference/reference/logs
            ${{ runner.temp }}/reference-download/artifact.json
          if-no-files-found: error
          retention-days: 7
